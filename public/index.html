<!DOCTYPE html>
<html>
<head>
  <title>V-Pair Work Order</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body style="font-family: Arial; padding: 20px;">

  <h1>V-Pair</h1>
  <h2 id="status">Loading...</h2>

  <p id="customer"></p>
  <p id="vehicle"></p>
  <p id="issue"></p>

  <div id="photos"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAcbdhvQZpERkHunxm7ODmR5l2Xc-lJ4HY",
      authDomain: "v-pair.firebaseapp.com",
      projectId: "v-pair",
      storageBucket: "v-pair.firebasestorage.app",
      messagingSenderId: "812529727370",
      appId: "1:812529727370:web:08cbd7ed0b89db1532ba73",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const pathParts = window.location.pathname.split("/");
    const workOrderId = pathParts[pathParts.length - 1];

    function loadWorkOrder() {
      db.collection("workOrders")
        .doc(workOrderId)
        .onSnapshot((doc) => {

          if (!doc.exists) {
            document.getElementById("status").innerText = "Work order not found";
            return;
          }

          const data = doc.data();

          document.getElementById("status").innerText = data.status;
          document.getElementById("customer").innerText = "Customer: " + data.customerName;
          document.getElementById("vehicle").innerText = "Vehicle: " + data.vehicleInfo;
          document.getElementById("issue").innerText = "Issue: " + data.issueDescription;

          const photoContainer = document.getElementById("photos");
          photoContainer.innerHTML = "";

          data.mediaURLs.forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            img.style.width = "100%";
            img.style.marginTop = "10px";
            photoContainer.appendChild(img);
          });
        });
    }

    loadWorkOrder();
  </script>

</body>
</html>
